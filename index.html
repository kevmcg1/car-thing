<!-- alpha testing popup: shown on every load of a project that is in alpha testing -->
<style>#alphaPop{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility .3s ease;font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}#alphaPop.on{opacity:1;visibility:visible;pointer-events:auto}#alphaPop .ap-card{box-sizing:border-box;width:min(430px,100%);padding:26px 24px 22px;text-align:center;background:#14151a;border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.6);transform:translateY(10px) scale(.96);transition:transform .3s ease}#alphaPop.on .ap-card{transform:none}#alphaPop .ap-ico{width:54px;height:54px;margin:0 auto 12px;border-radius:16px;display:grid;place-items:center;color:#fbbf24;border:1px solid rgba(251,191,36,.45);background:rgba(251,191,36,.08)}#alphaPop .ap-ico svg{width:24px;height:24px;fill:currentColor}#alphaPop h3{margin:0 0 8px;font:italic 700 17px/1.3 "Inter",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#fbbf24}#alphaPop p{margin:0 0 20px;color:#a9adb9;font-size:14px;line-height:1.5}#alphaPop button{font:600 14px/1 "Inter",system-ui,sans-serif;padding:11px 20px;border-radius:10px;color:#fbbf24;background:transparent;border:1px solid rgba(251,191,36,.6);cursor:pointer;transition:background-color .2s ease,border-color .2s ease,color .2s ease}#alphaPop button:hover,#alphaPop button:focus-visible{background:rgba(251,191,36,.12);border-color:#fbbf24;outline:none}@media (prefers-reduced-motion:reduce){#alphaPop,#alphaPop .ap-card{transition:none}}</style>
<div id="alphaPop" role="alertdialog" aria-modal="true" aria-labelledby="alphaPopT" aria-describedby="alphaPopP"><div class="ap-card"><div class="ap-ico"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7.2 40.1S486.3 480 472 480H40c-14.3 0-27.5-7.7-34.7-20.1s-7-27.8.2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0-64 0 32 32 0 1 0 64 0z"/></svg></div><h3 id="alphaPopT">Alpha testing</h3><p id="alphaPopP">This tool is in alpha testing and there may be bugs / glitches along the way.</p><button type="button" id="alphaPopGo">Continue anyway</button></div></div>
<script>(function(){var m=document.getElementById('alphaPop'),b=document.getElementById('alphaPopGo');if(!m||!b)return;var prev=null;function close(){m.classList.remove('on');m.setAttribute('aria-hidden','true');removeEventListener('keydown',key,true);try{prev&&prev.focus&&prev.focus({preventScroll:true})}catch(e){}setTimeout(function(){m.remove()},400)}function key(e){if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();e.stopPropagation();close()}}b.addEventListener('click',close);addEventListener('keydown',key,true);prev=document.activeElement;requestAnimationFrame(function(){m.classList.add('on');b.focus({preventScroll:true})})})();</script>
