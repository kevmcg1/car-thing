<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>car sim thing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,700;1,900&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212;
            font-family: 'Roboto', sans-serif;
            text-transform: uppercase;
            font-style: italic;
        }

        #header {
            position: absolute;
            top: 30px;
            left: 30px;
            color: white;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            pointer-events: none;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #footer {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            pointer-events: none;
            z-index: 10;
        }

        #back-button {
            position: absolute;
            bottom: 30px;
            left: 30px;
            height: 50px;
            padding: 0 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 20;
            backdrop-filter: blur(5px);
            color: white;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 1px;
            text-decoration: none;
        }

        #back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #4facfe;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.3);
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="header">car sim thing</div>
    <div id="footer">TEST_ENV_CHECKERED</div>

    <a id="back-button" href="https://kevmcg1.github.io">
